<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">antigravity-convo-renamer — Compact MMDD | theme sidebar organizer for Antigravity IDE</title>
  <desc id="hero-desc">Hero banner showing antigravity-convo-renamer transforming clipped long sidebar titles into compact date-prefixed Chinese and English labels that fit cleanly within 10 Chinese characters or 15 ASCII characters.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="clip-before">
      <rect x="0" y="0" width="440" height="118" rx="10"/>
    </clipPath>
  </defs>

  <!-- Full opaque background safe for GitHub Light and Dark themes -->
  <rect width="1200" height="380" rx="22" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Motif: vertical MMDD pipe rail accent -->
  <rect x="48" y="48" width="4" height="284" rx="2" fill="#10B981"/>

  <!-- Left Column: Category, Title, Concrete Value, Metadata -->
  <g transform="translate(76, 52)">
    <rect x="0" y="0" width="356" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#10B981"/>
    <text x="34" y="23" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="0.6">ANTIGRAVITY IDE UTILITY</text>

    <text x="0" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">antigravity-convo-</text>
    <text x="0" y="144" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">renamer</text>

    <text x="0" y="194" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="400">Turn clipped IDE chat lists into scannable</text>
    <text x="0" y="226" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="400">MMDD | theme labels on a 15-minute schedule.</text>

    <!-- Compact spec pills -->
    <g transform="translate(0, 254)">
      <rect x="0" y="0" width="196" height="32" rx="6" fill="#1E293B"/>
      <text x="14" y="22" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Antigravity 2.34+</text>

      <rect x="210" y="0" width="176" height="32" rx="6" fill="#1E293B"/>
      <text x="224" y="22" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">10 CJK / 15 Eng</text>

      <rect x="400" y="0" width="176" height="32" rx="6" fill="#1E293B"/>
      <text x="414" y="22" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">Zero Proxy Leak</text>
    </g>
  </g>

  <!-- Right Column: Real Before / After Sidebar Specimen -->
  <g transform="translate(672, 36)">
    <rect x="0" y="0" width="480" height="308" rx="16" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>

    <!-- BEFORE block -->
    <g transform="translate(20, 18)">
      <circle cx="8" cy="12" r="5" fill="#F59E0B"/>
      <text x="22" y="18" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">BEFORE · CLIPPED IN SIDEBAR</text>

      <g transform="translate(0, 30)" clip-path="url(#clip-before)">
        <rect x="0" y="0" width="440" height="114" rx="10" fill="#1E293B"/>
        <text x="16" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Stripe Integration Progress Che...</text>
        <text x="16" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Video Translation And Transcript...</text>
        <text x="16" y="100" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Delete Google Search Photos ...</text>
      </g>
    </g>

    <!-- AFTER block -->
    <g transform="translate(20, 166)">
      <circle cx="8" cy="12" r="5" fill="#10B981"/>
      <text x="22" y="18" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">AFTER · MMDD | COMPACT THEME</text>

      <rect x="0" y="28" width="440" height="96" rx="10" fill="#132238" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
      <text x="16" y="54" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">1121 | Stripe支付进度</text>
      <text x="16" y="84" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">1116 | 视频翻译转录工具</text>
      <text x="16" y="114" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">1119 | 删Google搜索照片</text>
    </g>
  </g>
</svg>
